<title>STAME</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 3D stage fills the screen while loading; on the creator screen it shares the row with a 420px side panel (desktop) or sits above a bottom sheet (phone). Graph-paper stage background nods to a study notebook and scrolls while the robot runs. */
:root {
  --bg1: #e7eff9;
  --bg2: #cfe0f3;
  --fg: #16213a;
  --muted: #55627d;
  --panel: #f7faff;
  --line: #c3d3e8;
  --chip: #e9f0fa;
  --accent: #3b63ff;
  --accent-fg: #ffffff;
  --accent-soft: #dce5ff;
  --grid: rgba(59, 99, 255, 0.09);
  --glow: rgba(255, 255, 255, 0.75);
  --coin: #ffb81f;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #121a2c;
    --bg2: #1b2742;
    --fg: #e8eefc;
    --muted: #9aa8c6;
    --panel: #19233a;
    --line: #2b3a5a;
    --chip: #223152;
    --accent: #7a98ff;
    --accent-fg: #0d1530;
    --accent-soft: #2b3d73;
    --grid: rgba(122, 152, 255, 0.10);
    --glow: rgba(122, 152, 255, 0.18);
    --coin: #ffc94d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg1: #121a2c;
  --bg2: #1b2742;
  --fg: #e8eefc;
  --muted: #9aa8c6;
  --panel: #19233a;
  --line: #2b3a5a;
  --chip: #223152;
  --accent: #7a98ff;
  --accent-fg: #0d1530;
  --accent-soft: #2b3d73;
  --grid: rgba(122, 152, 255, 0.10);
  --glow: rgba(122, 152, 255, 0.18);
  --coin: #ffc94d;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg1);
  background-image: linear-gradient(180deg, var(--bg1), var(--bg2));
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 0;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}
*, *::before, *::after { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
#app[data-screen="create"] { grid-template-columns: minmax(0, 1fr) 420px; }
@media (max-width: 859px) {
  #app[data-screen="create"] {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(210px, 38%) minmax(0, 1fr);
  }
}

.stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background-image:
    radial-gradient(ellipse 60% 55% at 50% 52%, var(--glow), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: auto, 32px 32px, 32px 32px;
  background-position: center, var(--gx, 0px) 0, var(--gx, 0px) 0;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#gl:active { cursor: grabbing; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--muted); }

/* Loading overlay */
.loading {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
  padding: 7vh 16px 6vh;
  pointer-events: none;
}
.loading > * { pointer-events: auto; }
.logo { margin: 0; text-align: center; font-family: var(--font-display); font-weight: 400; font-size: clamp(3rem, 11vw, 5.5rem); line-height: 1; letter-spacing: 0.06em; color: var(--accent); text-shadow: 0 4px 0 var(--accent-soft); }
.tagline { margin: 6px 0 0; text-align: center; color: var(--muted); font-weight: 500; }
.load-bottom { width: min(440px, 100%); display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.bar { height: 16px; border-radius: 8px; background: var(--chip); border: 2px solid var(--line); overflow: hidden; }
.fill { height: 100%; width: 0%; background: repeating-linear-gradient(135deg, var(--accent) 0 12px, color-mix(in srgb, var(--accent) 80%, white) 12px 24px); }
.statusrow { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tip { margin: 0; min-height: 3em; color: var(--muted); font-size: 0.92rem; }
.tip b { color: var(--fg); }

.primary {
  border: 0; border-radius: 10px; padding: 12px 22px;
  background: var(--accent); color: var(--accent-fg);
  font-weight: 700; font-size: 1.05rem;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, black);
  transition: transform 0.08s, box-shadow 0.08s;
}
.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 60%, black); }
.ghost {
  border: 2px solid var(--line); border-radius: 10px; padding: 10px 18px;
  background: transparent; font-weight: 700;
}
.ghost:hover { background: var(--chip); }

/* Panels */
.panel {
  min-width: 0; min-height: 0;
  background: var(--panel);
  border-left: 2px solid var(--line);
  display: flex; flex-direction: column;
  overflow-y: auto;
  padding: 18px 16px 0;
}
@media (max-width: 859px) {
  .panel { border-left: 0; border-top: 2px solid var(--line); padding-top: 12px; }
}
.panel header { margin-bottom: 8px; }
.eyebrow { margin: 0; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; color: var(--accent); }
.panel h2 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; line-height: 1.2; text-wrap: balance; }

.name-row { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
#nameIn {
  flex: 1; min-width: 0;
  border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px;
  background: var(--chip); font-size: 1.05rem; font-weight: 500;
}
#nameIn:focus { border-color: var(--accent); outline: none; }
.count { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 4px; }
.tab {
  flex: 1; border: 0; background: transparent; padding: 9px 4px;
  font-weight: 700; color: var(--muted);
  border-bottom: 4px solid transparent; margin-bottom: -2px;
}
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabpane[hidden] { display: none; }

.field { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.field:last-child { border-bottom: 0; }
.lab { font-size: 0.8rem; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
.hint { margin: 0; font-size: 0.8rem; color: var(--muted); }
.icos { display: flex; flex-wrap: wrap; gap: 8px; }
.ico {
  width: 52px; height: 52px; padding: 7px; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--chip); color: var(--fg);
  border: 3px solid transparent;
}
.ico svg { display: block; width: 100%; height: 100%; }
.ico.dark { padding: 0; overflow: hidden; }
.ico[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.ico.dark[aria-pressed="true"] { background: var(--chip); }
.ico.sm { width: 44px; height: 44px; padding: 6px; }
.sw {
  width: 36px; height: 36px; padding: 0; border-radius: 50%;
  background: var(--c); border: 3px solid var(--panel);
  box-shadow: 0 0 0 2px var(--line);
}
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
.swrow { display: flex; flex-wrap: wrap; gap: 9px; }

.accopt {
  display: grid; gap: 10px; padding: 12px;
  border: 2px solid var(--line); border-radius: 12px; background: var(--chip);
  margin-bottom: 10px;
}
.accopt:last-child { margin-bottom: 0; }
.acchead { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.acchead svg { width: 24px; height: 24px; color: var(--accent); }
.accopt .ico { background: var(--panel); }
.accopt .ico[aria-pressed="true"] { background: var(--accent-soft); }
.accopt .sw { border-color: var(--chip); }
.none { color: var(--muted); font-size: 0.9rem; margin: 0; }

.actions {
  position: sticky; bottom: 0; margin-top: auto;
  display: flex; gap: 10px; justify-content: space-between;
  background: var(--panel);
  padding-block: 12px;
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  border-top: 2px solid var(--line);
}
.actions .primary { flex: 1; }

.lead { margin: 8px 0 0; color: var(--muted); }
.mission {
  margin: 18px 0 12px; padding: 14px;
  border: 2px solid var(--line); border-radius: 12px; background: var(--chip);
  display: grid; gap: 2px;
}
.mission .tag { justify-self: start; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.mission strong { font-size: 1.15rem; margin-top: 4px; }
.mission span:last-child { color: var(--muted); }
.mission .coin { color: var(--coin); font-weight: 700; }
.note { color: var(--muted); font-size: 0.88rem; margin: 0 0 16px; }
.donep .ghost { align-self: flex-start; margin-bottom: 18px; }

/* removed */
.primary:disabled { background: var(--chip); color: var(--muted); box-shadow: 0 4px 0 var(--line); cursor: default; }
.back { align-self: flex-start; padding: 6px 12px; margin-bottom: 8px; font-size: 0.88rem; }

/* ===== World HUD ===== */
#iris { position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: 0; background: radial-gradient(circle at var(--cx, 50%) var(--cy, 50%), transparent var(--r, 0px), #000 calc(var(--r, 0px) + 2px)); }
#iris.on { opacity: 1; pointer-events: auto; }
#minimap { position: absolute; right: 10px; top: 66px; border: 2px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: 0 3px 0 var(--line); pointer-events: none !important; }
[hidden] { display: none !important; }
#rlabels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.rlabel {
  position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0; transition: opacity 0.15s;
  padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: 0.8rem;
  background: var(--panel); color: var(--fg); border: 2px solid var(--c, var(--line));
  box-shadow: 0 2px 0 var(--line);
}
.rlabel.sm { font-size: 0.68rem; padding: 1px 7px; }
#worldUI { position: absolute; inset: 0; pointer-events: none; }
#worldUI > * { pointer-events: auto; }
.hudbox {
  position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: 10px;
  background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 8px 12px; min-width: 190px; max-width: 46vw;
  box-shadow: 0 3px 0 var(--line);
}
.hudtop { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.hudtop strong { font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hudtop span { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
.sbar { height: 12px; border-radius: 6px; background: var(--chip); border: 2px solid var(--line); overflow: hidden; margin: 6px 0 4px; }
.sbar > div { height: 100%; width: 100%; background: #2fb67c; transition: width 0.3s; }
.sbar.low > div { background: #e0584a; }
.hudstats { display: flex; justify-content: space-between; gap: 6px; font-size: 0.76rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.hudstats small { color: var(--muted); font-weight: 500; }\n#hudMoney{font-size:.76rem;font-weight:800;margin-top:4px;color:var(--muted)}
#hudLoc { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-fg); font-weight: 700; padding: 4px 14px; border-radius: 999px; font-size: 0.86rem; pointer-events: none; white-space: nowrap; }
.topbtns { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); right: 10px; display: flex; gap: 8px; align-items: flex-start; }
.roundbtn { border: 2px solid var(--line); background: var(--panel); border-radius: 14px; min-width: 46px; height: 46px; padding: 0 12px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 3px 0 var(--line); }
.roundbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.roundbtn svg { width: 24px; height: 24px; }
#leftCol { position: absolute; left: 10px; top: 118px; display: grid; gap: 8px; width: min(220px, 44vw); }
.sidebox { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 6px; box-shadow: 0 3px 0 var(--line); }
.boxtitle { font-family: var(--font-display); font-size: 1rem; }
.boxline { font-size: 0.86rem; color: var(--muted); }
.actbtn { display: grid; gap: 1px; text-align: left; border: 2px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--chip); font-weight: 700; }
.actbtn small { font-weight: 500; color: var(--muted); font-size: 0.74rem; }
.actbtn:hover { border-color: var(--accent); }
.actbtn.dim { opacity: 0.55; }
.prog { height: 10px; border-radius: 5px; background: var(--chip); border: 2px solid var(--line); overflow: hidden; }
.progfill { height: 100%; width: 0; background: var(--accent); }
.small { padding: 5px 10px; font-size: 0.82rem; border-radius: 8px; }
.wide { width: 100%; }
#interactBtn { position: absolute; left: 50%; bottom: max(26px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: 60vw; }
#doorCloseBtn { position:absolute; left:50%; bottom:max(76px,calc(env(safe-area-inset-bottom,0px) + 76px)); transform:translateX(-50%); }
#stopBtn { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: #d6455d; color: #fff; border: 0; border-radius: 999px; padding: 10px 22px; font-weight: 700; box-shadow: 0 4px 0 #8c2536; }
#joy { position: absolute; left: 22px; bottom: max(26px, env(safe-area-inset-bottom, 0px)); width: 132px; height: 132px; border-radius: 50%; background: color-mix(in srgb, var(--panel) 70%, transparent); border: 2px solid var(--line); touch-action: none; display: grid; place-items: center; }
#joyKnob { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); opacity: 0.85; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, black); pointer-events: none; }
#jumpBtn { position: absolute; right: 26px; bottom: max(40px, env(safe-area-inset-bottom, 0px)); width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 1rem; box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 60%, black); touch-action: none; }
#jumpBtn:active { transform: translateY(3px); }
#toast { position: absolute; left: 50%; top: 84px; transform: translate(-50%, -8px); background: var(--fg); color: var(--bg1); padding: 8px 16px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: 88vw; text-align: center; z-index: 5; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#fade { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 4; }
#fade.on { opacity: 0.85; transition: none; }
#sheet { position: absolute; inset: 0; background: rgba(10, 20, 45, 0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 6; }
@media (min-width: 700px) { #sheet { align-items: center; } }
.sheetcard { width: min(560px, 100%); max-height: min(88%, 720px); display: flex; flex-direction: column; background: var(--panel); border: 2px solid var(--line); border-radius: 20px 20px 0 0; }
@media (min-width: 700px) { .sheetcard { border-radius: 20px; } }
.sheethead { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 8px 18px; border-bottom: 2px solid var(--line); }
.sheethead h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; }
#sheetBody { padding: 14px 18px 22px; overflow: auto; display: grid; gap: 10px; align-content: start; }
.hint { margin: 0; color: var(--muted); font-size: 0.86rem; }
.lab { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip, .dest, .tab { border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; background: var(--chip); font-weight: 700; font-size: 0.88rem; }
.chip[aria-pressed="true"], .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.dest { border-radius: 10px; }
.tabs { display: flex; gap: 6px; }
.qhead { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.86rem; }
.qby { color: var(--accent); }
.qtext { margin: 0; font-size: 1.05rem; font-weight: 700; white-space: pre-wrap; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--chip); font-weight: 500; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.right { border-color: #2fb67c; background: color-mix(in srgb, #2fb67c 25%, var(--chip)); }
.choice.wrong { border-color: #e0584a; background: color-mix(in srgb, #e0584a 22%, var(--chip)); }
.shortrow { display: flex; gap: 8px; }
.shortrow input, .ffield input[type=text], .ffield textarea, .optrow input[type=text] { flex: 1; min-width: 0; width: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--bg1); }
.qres { border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
.qres.ok { background: color-mix(in srgb, #2fb67c 20%, var(--chip)); }
.qres.no { background: color-mix(in srgb, #e0584a 16%, var(--chip)); }
.form { display: grid; gap: 10px; }
.ffield { display: grid; gap: 4px; }
.optrow { display: flex; gap: 8px; align-items: center; }
.optrow input[type=radio] { width: 22px; height: 22px; flex: none; }
.formmsg { color: #d6455d; font-weight: 700; font-size: 0.86rem; min-height: 1.2em; }
.mine, .classcard { border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; background: var(--chip); }
.classcard.mine { border-color: var(--accent); background: var(--accent-soft); }
.classhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.roster { font-size: 0.86rem; }
.dgroup { border: 2px solid var(--line); border-radius: 12px; background: var(--chip); }
.dgroup summary { padding: 10px 14px; font-weight: 700; cursor: pointer; }
.dlist { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.settxt { display: grid; }
.settxt small { color: var(--muted); }
.switch { width: 52px; height: 30px; border-radius: 15px; border: 0; background: var(--line); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
.switch[aria-checked="true"] { background: var(--accent); }

.sleep-scene,.study-scene{display:grid;place-items:center;min-height:150px;border-radius:16px;background:linear-gradient(135deg,#dfe9fa,#f8e9dc);overflow:hidden}
.sleep-bed{position:relative;width:190px;height:58px;border-radius:24px 24px 12px 12px;background:#8ba8d8;animation:sleepBob 2.8s ease-in-out infinite;box-shadow:inset 0 10px #f5f7ff}
.sleep-bed span{position:absolute;top:-32px;right:20px;font-weight:800;color:#6c82b5;animation:zzz 2s infinite}
.sleep-bed span:nth-child(2){right:48px;top:-45px;animation-delay:.5s}.sleep-bed span:nth-child(3){right:75px;top:-56px;animation-delay:1s}
.sleep-moon{font-size:34px;color:#e1b95d}
.study-desk{position:relative;width:230px;height:110px;border-bottom:12px solid #9c795b;display:grid;place-items:center}
.study-person{font-size:48px;animation:studyNod 1.8s ease-in-out infinite}
.study-book{position:absolute;bottom:12px;right:25px;background:#fff;padding:4px 12px;border-radius:5px;font-size:12px}
.study-lamp{position:absolute;top:0;left:18px;font-size:30px}
@keyframes sleepBob{50%{transform:translateY(5px) scale(1.02)}}@keyframes zzz{50%{transform:translate(8px,-8px);opacity:.35}}
@keyframes studyNod{50%{transform:translateY(4px) rotate(3deg)}}

  function openSolve(subj, grade) {
    var S = { filter: 'all', phase: 'pick', queue: [], i: 0, ok: 0, answered: false, last: null };
    function render() {
      var body = sbody();
      if (S.phase === 'pick') {
        var all = questionsFor(subj), counts = {}, order = [];
        all.forEach(function (it) { if (!(it.by in counts)) { counts[it.by] = 0; order.push(it.by); } counts[it.by]++; });
        order.sort(function (a, b) { return a === '오리지널' ? -1 : b === '오리지널' ? 1 : a < b ? -1 : 1; });
        if (S.filter !== 'all' && !(S.filter in counts)) S.filter = 'all';
        body.appendChild(el('p', 'hint', (grade ? grade + '학년 층 ' : '') + SUBJ[subj].n + ' 문제를 풀어요. 문제 1개당 스태미나 3과 학교 포인트 5가 필요해요. 정답이면 학교 포인트 10을 받아요.'));
        body.appendChild(el('div', 'lab', '출제자 고르기'));
        var chips = el('div', 'chips');
        function chip(label, key, n) { var b = btn(label + ' ' + n, 'chip', function () { S.filter = key; render(); }); b.setAttribute('aria-pressed', S.filter === key ? 'true' : 'false'); chips.appendChild(b); }
        chip('전체', 'all', all.length);
        order.forEach(function (by) { chip('(' + by + ')', by, counts[by]); });
        body.appendChild(chips);
        var n = S.filter === 'all' ? all.length : counts[S.filter] || 0;
        var go = btn(n ? '풀기 시작 (최대 10문제)' : '아직 문제가 없어요', 'primary wide', function () {
          var pool = all.filter(function (it) { return S.filter === 'all' || it.by === S.filter; });
          S.queue = shuffle(pool).slice(0, 10); S.i = 0; S.ok = 0; S.phase = 'quiz'; S.answered = false; render();
        });
        go.disabled = !n; body.appendChild(go);
        body.appendChild(el('p', 'hint', '선생님이 되면 직접 문제를 낼 수도 있어요. 교무실 선생님 자리에서 선생님이 될 수 있어요.'));
      } else if (S.phase === 'quiz') {
        var it = S.queue[S.i], q = it.q;
        var head = el('div', 'qhead'); head.appendChild(el('span', 'qnum', '문제 ' + (S.i + 1) + '/' + S.queue.length)); head.appendChild(el('span', 'qby', '(' + it.by + ')')); body.appendChild(head);
        body.appendChild(el('p', 'qtext', q.q));
        var res = el('div', 'qres'); res.hidden = true;
        function judge(given) {
          if (S.answered) return;
          if (P.stamina < 3) { toast('스태미나가 부족해요. 급식을 먹거나 쉬어 보세요.'); S.phase = 'done'; render(); return; }
          if ((P.schoolMoney||0) < 5) { toast('학교 포인트가 부족해요.'); S.phase = 'done'; render(); return; }
          S.answered = true; P.stamina -= 3; P.schoolMoney = Math.max(0,(P.schoolMoney||0)-5);
          var ok = checkAnswer(q, given);
          if (ok) { S.ok++; P.correct++; P.int += 0.5; P.schoolMoney += 10; }
          savePlayer(); updateHud();
          res.hidden = false; res.className = 'qres ' + (ok ? 'ok' : 'no');
          res.innerHTML = '';
          res.appendChild(el('strong', null, ok ? '정답이에요! 지능 +0.5 · 학교 포인트 +10' : '아쉬워요. 학교 포인트 -5'));
          if (!ok) res.appendChild(el('div', null, '정답: ' + (q.t === 'choice' ? q.c[q.a] : String(q.a).split('|')[0])));
          if (q.e) res.appendChild(el('div', 'hint', q.e));
          var last = S.i + 1 >= S.queue.length;
          res.appendChild(btn(last ? '결과 보기' : '다음 문제', 'primary wide', function () { S.i++; S.answered = false; if (last) S.phase = 'done'; render(); }));
          if (q.t === 'choice') { ch.forEach(function (b, k) { b.disabled = true; if (k === q.a) b.classList.add('right'); else if (k === given) b.classList.add('wrong'); }); }
          else { inp.disabled = true; }
        }
        var ch = [], inp = null;
        if (q.t === 'choice') {
          var list = el('div', 'choices');
          q.c.forEach(function (c, k) { var b = btn((k + 1) + '. ' + c, 'choice', function () { judge(k); }); ch.push(b); list.appendChild(b); });
          body.appendChild(list);
        } else {
          var row = el('div', 'shortrow'); inp = el('input'); inp.type = 'text'; inp.maxLength = 60; inp.placeholder = '정답을 입력해요'; inp.setAttribute('aria-label', '정답');
          var ok2 = btn('확인', 'primary', function () { if (inp.value.trim()) judge(inp.value); });
          inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' && inp.value.trim()) judge(inp.value); });
          row.appendChild(inp); row.appendChild(ok2); body.appendChild(row);
        }
        body.appendChild(res);
      } else {
        body.appendChild(el('p', 'qtext', '결과: ' + S.ok + '/' + S.queue.length + '문제 맞혔어요.'));
        body.appendChild(el('p', 'hint', '지금까지 맞힌 문제 ' + P.correct + '개 · 지능 ' + Math.floor(P.int)));
        body.appendChild(btn('다시 고르기', 'primary wide', function () { S.phase = 'pick'; render(); }));
        body.appendChild(btn('닫기', 'ghost wide', closeSheet));
      }
    }
    openSheet(SUBJ[subj].n + ' 교과교실', function () { if (S.phase === 'pick') render(); });
    render();
  }

  function openAuthor(subj) {
    openSheet(SUBJ[subj].n + ' 문제 출제하기');
    var F = { t: 'choice', q: '', c: ['', '', '', ''], a: 0, ans: '', e: '' };
    var b = sbody();
    var seg = el('div', 'chips');
    var bc = btn('객관식', 'chip', function () { F.t = 'choice'; draw(); }), bs = btn('단답형', 'chip', function () { F.t = 'short'; draw(); });
    seg.appendChild(bc); seg.appendChild(bs); b.appendChild(seg);
    var form = el('div', 'form'); b.appendChild(form);
    var msg = el('div', 'formmsg'); b.appendChild(msg);
    function field(label, node) { var w = el('label', 'ffield'); w.appendChild(el('span', 'lab', label)); w.appendChild(node); return w; }
    function draw() {
      bc.setAttribute('aria-pressed', F.t === 'choice' ? 'true' : 'false'); bs.setAttribute('aria-pressed', F.t === 'short' ? 'true' : 'false');
      form.innerHTML = '';
      var ta = el('textarea'); ta.rows = 3; ta.maxLength = 200; ta.value = F.q; ta.placeholder = '문제를 적어요 (200자까지)';
      ta.addEventListener('input', function () { F.q = ta.value; });
      form.appendChild(field('문제', ta));
      if (F.t === 'choice') {
        F.c.forEach(function (c, k) {
          var row = el('div', 'optrow'); var r = el('input'); r.type = 'radio'; r.name = 'okc'; r.checked = F.a === k; r.setAttribute('aria-label', (k + 1) + '번이 정답');
          r.addEventListener('change', function () { F.a = k; });
          var t = el('input'); t.type = 'text'; t.maxLength = 60; t.value = c; t.placeholder = (k + 1) + '번 보기';
          t.addEventListener('input', function () { F.c[k] = t.value; });
          row.appendChild(r); row.appendChild(t); form.appendChild(row);
        });
        form.appendChild(el('p', 'hint', '정답인 보기 옆 동그라미를 골라요.'));
      } else {
        var ai = el('input'); ai.type = 'text'; ai.maxLength = 60; ai.value = F.ans; ai.placeholder = '정답 (답이 여러 개면 | 로 나눠요)';
        ai.addEventListener('input', function () { F.ans = ai.value; });
        form.appendChild(field('정답', ai));
      }
      var ei = el('input'); ei.type = 'text'; ei.maxLength = 200; ei.value = F.e; ei.placeholder = '해설 (선택)';
      ei.addEventListener('input', function () { F.e = ei.value; });
      form.appendChild(field('해설', ei));
      form.appendChild(btn('문제 내기', 'primary wide', save));
    }
    function save() {

    var tz2 = screen === 'loading' ? (camera.aspect < 1 ? 0.72 : 0.85) : 1;
    camZoom += (tz2 - camZoom) * Math.min(1, dt * 5);
    if (Math.abs(camera.zoom - camZoom) > 0.001) { camera.zoom = camZoom; camera.updateProjectionMatrix(); }
    if (inWorld && cur) {
      var kk = cur.camK * Math.max(1, 1.25 / camera.aspect), D = CAM.dist * kk, cp = Math.cos(CAM.pitch);
      var firstPerson = CAM.dist < 1.15;
      camWorld.look.set(player.x, firstPerson ? 1.55 : 0.5, player.z);
      camWorld.pos.set(player.x + Math.sin(CAM.yaw) * cp * D, (firstPerson ? 1.55 : 0.5) + Math.sin(CAM.pitch) * D, player.z + Math.cos(CAM.yaw) * cp * D);
      if(!firstPerson){
        var dxCam=camWorld.pos.x-player.x, dzCam=camWorld.pos.z-player.z, stepsCam=Math.max(2,Math.ceil(Math.hypot(dxCam,dzCam)/0.12)), lastX=player.x, lastZ=player.z;
        for(var ci=1;ci<=stepsCam;ci++){var uu=ci/stepsCam, qx=player.x+dxCam*uu, qz=player.z+dzCam*uu;if(blockedAt(cur,qx,qz))break;lastX=qx;lastZ=qz;}
        camWorld.pos.x=lastX; camWorld.pos.z=lastZ;
      }
    }
    var ct = inWorld ? camWorld : camAvatar, kc = (inWorld && camSnap) ? 1 : Math.min(1, dt * (inWorld ? 6 : 3.5));
    camSnap = false;
    camera.position.lerp(ct.pos, kc); camLook.lerp(ct.look, kc);
    camera.lookAt(camLook); camera.updateMatrixWorld(true);
    if (inWorld && cur && cur.ceiling) cur.ceiling.visible = camera.position.y < (cur.ceiling.userData.ceilingTop || 3.0) - 0.04;
    if (inWorld) { projectLabels(); irisTick(dt); miniT -= dt; if (miniT <= 0) { miniT = 0.1; drawMini(); } }

    // face
    var lx = screen === 'loading' ? 0.5 + Math.sin(t * 1.8) * 0.2 : look;
    var blink = (t % 3.6) > 3.47;
    var dots = Math.floor(t * 2.5) % 4;
    var key = [state.eyes, state.eyeColor, state.mouth, state.brows, state.blush, screen, blink, Math.round(lx * 40), screen === 'loading' ? dots : 0].join('|');
    if (key !== lastFaceKey) { lastFaceKey = key; drawFace(blink, lx, dots); }

    renderer.render(scene, camera);
  }

  /* ================= start ================= */
  var ok = initThree();
  if (!ok) { $('#fallback').hidden = false; }
  else {
    build();
    labelHost = $('#rlabels'); applySettings(); updateHud(); renderTeacherBox(); initData();
    onResize();
    if (window.ResizeObserver) new ResizeObserver(onResize).observe(stage);
    window.addEventListener('resize', onResize);
    camera.zoom = camZoom; camera.updateProjectionMatrix();
  }
  requestAnimationFrame(frame);
})();
</script>
